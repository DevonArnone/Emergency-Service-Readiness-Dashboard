name: aegis-command

services:
  postgres:
    image: postgres:16.15-alpine3.24
    environment:
      POSTGRES_DB: aegis
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/runtime-role.sql:/docker-entrypoint-initdb.d/runtime-role.sql:ro

  redis:
    image: redis:7.4.5-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v25.2.4
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -Eq 'Healthy:[[:space:]]+true'"]
      interval: 10s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:19092:19092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-local-only
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8080
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro

  migrate:
    build:
      context: ./backend
    command: ["python", "-m", "app.bootstrap"]
    environment:
      DATABASE_URL: postgresql+psycopg://aegis:aegis-local-only@postgres:5432/aegis
      AUTO_CREATE_SCHEMA: "false"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://aegis_runtime:aegis-runtime-local-only@postgres:5432/aegis
      DEFAULT_ORGANIZATION_ID: fcfrd-demo
      AUTO_CREATE_SCHEMA: "false"
      SEED_DEMO_ON_EMPTY: "false"
      APP_ENV: development
      AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
      PUBLIC_DEMO_WRITE_ENABLED: ${PUBLIC_DEMO_WRITE_ENABLED:-false}
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      PIPELINE_PROFILE: ${PIPELINE_PROFILE:-optimized}
      REDIS_URL: redis://redis:6379/0
      REDIS_FANOUT_ENABLED: "true"
      OIDC_ISSUER: http://localhost:8080/realms/aegis
      OIDC_DISCOVERY_URL: http://keycloak:8080/realms/aegis/.well-known/openid-configuration
      OIDC_JWKS_URL: http://keycloak:8080/realms/aegis/protocol/openid-connect/certs
      OIDC_AUDIENCE: aegis-api
      CORS_ORIGINS: http://localhost:3000
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "${API_WORKERS:-4}"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:8000:8000"

  outbox-worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.workers.outbox", "--stream", "bulk"]
    environment:
      DATABASE_URL: postgresql+psycopg://aegis_runtime:aegis-runtime-local-only@postgres:5432/aegis
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      KAFKA_REPLICATION_FACTOR: 1
      PIPELINE_PROFILE: ${PIPELINE_PROFILE:-optimized}
    depends_on:
      api:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  alert-outbox-worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.workers.outbox", "--stream", "alerts"]
    environment:
      DATABASE_URL: postgresql+psycopg://aegis_runtime:aegis-runtime-local-only@postgres:5432/aegis
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      PIPELINE_PROFILE: ${PIPELINE_PROFILE:-optimized}
    depends_on:
      api:
        condition: service_healthy

  alert-bridge:
    build:
      context: ./backend
    command: ["python", "-m", "app.workers.realtime_bridge", "--stream", "alerts"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy

  bulk-bridge:
    build:
      context: ./backend
    command: ["python", "-m", "app.workers.realtime_bridge", "--stream", "bulk"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy

  shared-bridge:
    build:
      context: ./backend
    command: ["python", "-m", "app.workers.realtime_bridge", "--stream", "shared"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy

  dashboard:
    build:
      context: ./dashboard
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        NEXT_PUBLIC_OIDC_AUTHORITY: ${NEXT_PUBLIC_OIDC_AUTHORITY:-}
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres-data:
  redis-data:
  redpanda-data:
